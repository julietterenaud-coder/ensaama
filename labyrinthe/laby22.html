<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>

  <body>

    <a-scene>

     <a-assets>

      <!--load objets 3d-->

      <a-asset-items id="toilet" src="../3d/toiyl.gltf"></a-asset-items>
      <a-asset-items id="toilet2" src="../3d/toiyzzl.bin"></a-asset-items>
      <a-asset-items id="popo" src="../3d/popo.gltf"></a-asset-items>
      <a-asset-items id="bbh" src="../3d/bbh.gltf"></a-asset-items>
      <a-asset-items id="floor" src="../3d/chatsimp.gltf"></a-asset-items>

      <!--images-->

      <img id="texture" src="../textures/a8387a9134412927de6c3c4dd26c9f8d.jpg">
      <img id="textu" src="../textures/aerial_rocks_02_diff_1k.jpg">
      <img id="textu1" src="../textures/aerial_rocks_02_rough_1k.jpg">
      <img id="land1" src="../textures/gg2.jpg">
      <img id="land2" src="../textures/waallaskapeje.png">
     </a-assets>

    <!--objets 3d-->
    <a-entity gltf-model="#toilet" scale="0.1 0.1 0.1" position="0 0 0" rotation="0 90 0"></a-entity>
    <a-entity gltf-model="#bbh" scale="1 1 1" position="1.583 1 -2.901" rotation="0 -156.4 0"></a-entity>     
    <a-entity gltf-model="#toilet2" scale="0.1 0.1 0.1" position="-3 0 3" rotation="0 0 0"></a-entity>
    <a-entity gltf-model="#popo" scale="0.5 0.5 0.5" position="2 0 2"></a-entity>
    <a-entity gltf-model="#floor" scale="1 1 1" position="0 0 0 " rotation="0 0 0"></a-entity>


 
    <!--mur de devant-->
    <a-plane position="-0.99 1.5 2" rotation="0 180 0" width="2" height="4" material="src: #textu; side: double"></a-plane>
    <!--mur gauche ext-->
    <a-plane position="-2 1.5 0" rotation="0 90 0" width="4" height="4" material="src: #textu; side: double"></a-plane>
    <!--mur ext droit-->
    <a-plane position="2 1.5 0" rotation="0 -90 0" width="4" height="4" material="src: #textu; side: double"></a-plane>
    <!--murs arrière-->
    <a-plane position="-0.4 1.5 -2" width="4" height="4" material="src: #textu; side: double"></a-plane>
    <!--murs interieurs-->
    <a-plane position="-0.65 1.46 -1.485" rotation="0 90 0" width="1" height="4" material="src: #textu; side: double"></a-plane>
    <a-plane position="-1.30 1.46 -1.124" rotation="0 90 0" width="2" height="4" material="src: #textu; side: double"></a-plane>
    <a-plane position="1.77 1.51 -0.77" width="2" height="4" material="src: #textu; side: double"></a-plane>
    <a-plane position="1.25 1.51 0.75" width="2" height="4" material="src: #textu; side: double"></a-plane>
    <a-plane position="-0.26 1.97 1.46" width="2" height="4" material="src: #textu; side: double"></a-plane>   
    <a-plane position="-1.21 1.51 0.21" width="2" height="4" material="src: #textu; side: double"></a-plane>
    <a-plane position="-1.67 1.51 0.71" width="2" height="4" material="src: #textu; side: double"></a-plane>
    <a-plane position="-0.34 1.47 0.61" rotation="0 90 0" width="1" height="4" material="src: #textu; side: double"></a-plane>
    <a-plane position="0.42 1.51 -0.42" width="2" height="4" material="src: #textu; side: double"></a-plane>
    <a-plane position="0.86 1.47 -0.84" rotation="0 90 0" width="1" height="4" material="src: #textu; side: double"></a-plane>

    <a-sky src="#land1"></a-sky>

    <a-entity camera="" position="1.3 1.6 2.6" wasd-controls="acceleration:5" rotation="-1.15 360.5 0" look-controls="" aframe-injected=""></a-entity>
    
    </a-scene>
  </body>
</html>
